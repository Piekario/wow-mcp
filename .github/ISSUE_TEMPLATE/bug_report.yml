name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please check the README section "When something does not work" first.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: wow_doctor output
      description: Ask your assistant to run the `wow_doctor` tool and paste the result. Remove anything you consider private.
      render: json
  - type: textarea
    id: status
    attributes:
      label: /mcp status in game
      description: Type `/mcp status` in game and paste the chat output (section errors are the most useful part).
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Server version (`wow-mcp --version`), addon version, game client and its version, operating system.
      placeholder: "server 0.17.0, addon 0.16.0, WoW Forever 1.60.1, Windows 11"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - npx (npm)
        - Release archive with install.ps1 / install.sh
        - Built from source
    validations:
      required: true
