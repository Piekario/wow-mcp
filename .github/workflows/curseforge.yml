# CurseForge: on an addon tag (addon-v<version>, the version in addon/WowMcp/WowMcp.toc), package the WowMcp addon with
# BigWigsMods/packager (see .pkgmeta) and upload it. Needs the CF_API_KEY secret (a CurseForge API token) and the
# CF_PROJECT_ID repository variable (the project id from the CurseForge author console). The game version comes from
# `## Interface:` in the .toc. Run it by hand with "dry run" to only build the zip and download it as an artifact.
name: CurseForge

on:
  push:
    tags:
      - 'addon-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only build the zip, do not upload'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    name: Package and upload the addon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches the addon version
        if: startsWith(github.ref, 'refs/tags/addon-v')
        run: |
          want="addon-v$(scripts/version.sh addon)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match the addon version (expected $want)" >&2
            exit 1
          fi
      - name: Package name, label and upload switch
        id: meta
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: |
          v=$(scripts/version.sh addon)
          echo "name={package-name}-$v:{package-name} $v" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ] || [ -z "$PROJECT_ID" ]; then
            echo "args=-d" >> "$GITHUB_OUTPUT"
          else
            echo "args=-p $PROJECT_ID" >> "$GITHUB_OUTPUT"
          fi
      - name: Package (and upload unless this is a dry run)
        uses: BigWigsMods/packager@v2
        with:
          args: ${{ steps.meta.outputs.args }} -n "${{ steps.meta.outputs.name }}"
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: curseforge-zip
          path: .release/*.zip
          include-hidden-files: true
