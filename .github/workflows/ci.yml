# CI: server tests (Go, three operating systems), addon tests (Lua), shell script lint and the Windows installer test.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Server (Go, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        if: matrix.os == 'ubuntu-latest'
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: 'go test (with the race detector: tool calls may run concurrently)'
        run: go test -race ./...

  addon:
    name: Addon (Lua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Addon test dependencies
        run: pip install lupa
      - name: Test dumps match the approved ones
        run: scripts/check-addon-fixtures.sh
      - name: luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check
          make lint

  scripts:
    name: Shell scripts and release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh
      - name: Release archives build
        run: make dist

  installer:
    name: Windows installer (install.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: install.ps1 under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-install.ps1
      - name: install.ps1 under PowerShell 7
        shell: pwsh
        run: .\scripts\test-install.ps1

  identities:
    name: Commit identities
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The pattern lives in the repository variable BLOCKED_IDENTITIES (an extended regex), not in this file.
      - name: No commit with a blocked author or committer
        env:
          PATTERN: ${{ vars.BLOCKED_IDENTITIES }}
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          [ -n "$PATTERN" ] || exit 0
          bad=$(git log --format='%h %an <%ae> / %cn <%ce>' "$RANGE" | grep -i -E "$PATTERN" || true)
          [ -z "$bad" ] || { echo "Commits with a blocked author or committer:"; echo "$bad"; exit 1; }
